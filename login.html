<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BRIS - Login</title>

    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="navbar-styles.css">
    <link rel="stylesheet" href="login-styles.css">

    <link href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
</head>

<body class="login-page">
    <!-- Navbar Placeholder -->
    <div id="navbar-placeholder"></div>

    <!-- Login Container -->
    <div class="login-section">
        <button class="login-close" id="closeLogin" onclick="window.location.href='index.html';">
            <i class='bx bx-x'></i>
        </button>

        <div class="container" id="login-container">
            <div class="form-container sign-up">
                <form id="signUpFormBris"> 
                    <h1>Create Account</h1>
                    <div class="social-icons">
                        <a href="#" class="icon"><i class="fa-brands fa-google-plus-g"></i></a>
                        <a href="#" class="icon"><i class="fa-brands fa-facebook-f"></i></a>
                        <a href="#" class="icon"><i class="fa-brands fa-github"></i></a>
                        <a href="#" class="icon"><i class="fa-brands fa-linkedin-in"></i></a>
                    </div>
                    <span>or use your email for registration</span>
                    <input type="text" placeholder="Name" id="signUpName" required/>
                    <input type="email" placeholder="Email" id="signUpEmail" required/>
                    <input type="password" placeholder="Password" id="signUpPassword" required/>
                    <button type="submit">Sign Up</button>
                </form>
            </div>
            <div class="form-container sign-in">
                <form id="signInFormBris">
                    <h1>Sign In</h1>
                    <div class="social-icons">
                        <a href="#" class="icon"><i class="fa-brands fa-google-plus-g"></i></a>
                        <a href="#" class="icon"><i class="fa-brands fa-facebook-f"></i></a>
                        <a href="#" class="icon"><i class="fa-brands fa-github"></i></a>
                        <a href="#" class="icon"><i class="fa-brands fa-linkedin-in"></i></a>
                    </div>
                    <span>or use your email password</span>
                    <input type="email" placeholder="Email" id="signInEmail" required/>
                    <input type="password" placeholder="Password" id="signInPassword" required/>
                    <a href="#">Forgot Your Password?</a>
                    <button type="submit">Sign In</button>
                </form>
            </div>
            <div class="toggle-container">
                <div class="toggle">
                    <div class="toggle-panel toggle-left">
                        <h1>Welcome Back!</h1>
                        <p>Enter your personal details to use all of site features</p>
                        <button class="hidden" id="login">Sign In</button>
                    </div>
                    <div class="toggle-panel toggle-right">
                        <h1>Hello, Friend!</h1>
                        <p>Register with your personal details to use all of site features</p>
                        <button class="hidden" id="register">Sign Up</button>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <div id="toast-container"></div>
    <!-- SCRIPTS - ORDER IS IMPORTANT -->
    <!-- 1. Supabase Library from CDN (makes 'supabase' globally available) -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script> 
    
    <!-- 2. Your Supabase Client Initializer (uses global 'supabase', creates 'window.supabaseClient') -->
    <script src="supabase-client.js"></script> <!-- Assuming supabase-client.js is in the root -->
    
    <!-- 3. Navbar Script (may use window.supabaseClient for auth state, defines window.initializeNavbar) -->
    <script src="navbar-script.js"></script> 
    
    <!-- 4. Login Page Specific Script (uses window.supabaseClient) -->
    <script src="login-script.js"></script> 

    <!-- Loader Script for Navbar (if using placeholder method on login.html) -->
    <script> 
        document.addEventListener('DOMContentLoaded', function() {
            const navbarPlaceholder = document.getElementById('navbar-placeholder');
            if (navbarPlaceholder) {
                fetch('navbar.html')
                    .then(response => {
                        if (!response.ok) throw new Error(`HTTP error! status: ${response.status}`);
                        return response.text();
                    })
                    .then(data => {
                        navbarPlaceholder.innerHTML = data;
                        if (typeof window.initializeNavbar === 'function') {
                            // console.log("login.html (placeholder loader): Calling initializeNavbar");
                            window.initializeNavbar(); 
                        } else {
                            console.error("login.html: initializeNavbar is not defined after fetching navbar.html. Check navbar-script.js.");
                        }
                    })
                    .catch(error => console.error('Error loading navbar in login.html:', error));
            } else {
                 // If no placeholder is used on this page, navbar-script.js should self-initialize.
                 // However, calling it again here after all scripts are loaded ensures it runs if its own
                 // DOMContentLoaded fired too early relative to other scripts defining window.supabaseClient.
                 if (typeof window.initializeNavbar === 'function') {
                    // console.log("login.html (no placeholder): Calling initializeNavbar on DOMContentLoaded.");
                    window.initializeNavbar();
                }
            }
        });
    </script>
</body>
</html>
